name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Frontend Tests & Build
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /alpha-quant-academy/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: webapp-dist
          path: webapp/dist
          retention-days: 7

  # Python Tests
  python:
    name: Python CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2.2'
          pip install pytest ruff mypy nbformat
      
      - name: Syntax Check
        run: |
          find . -name "*.py" -not -path "./webapp/*" -not -path "./.git/*" -exec python -m py_compile {} +
      
      - name: Lint with Ruff
        run: ruff check . --ignore E501

  # Notebook Validation
  notebooks:
    name: Notebook Validation
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      
      - name: Install nbformat
        run: |
          python -m pip install --upgrade 'pip>=26.2.2'
          pip install nbformat
      
      - name: Validate Notebooks
        run: |
          python -c "
          import nbformat
          import subprocess
          import sys
          
          notebooks = subprocess.run(
              ['git', 'ls-files', '--', '*.ipynb'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          if not notebooks:
              print('No tracked notebooks found', file=sys.stderr)
              sys.exit(1)
          
          errors = []
          for nb_path in notebooks:
              try:
                  with open(nb_path, 'r') as f:
                      nbformat.read(f, as_version=4)
                  print(f'✓ {nb_path}')
              except Exception as e:
                  errors.append(f'✗ {nb_path}: {e}')
                  print(f'✗ {nb_path}: {e}')
          
          if errors:
              sys.exit(1)
          print(f'\n✓ All {len(notebooks)} notebooks valid')
          "
